
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Spot2Fix</title>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f4f8;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 8px 28px #00000012;
        }
        .sf-brand { display: inline-block; color: #207D73; text-decoration: none; font-size: 23px; font-weight: 800; letter-spacing: 1px; line-height: 1; margin-bottom: 22px; }
        .sf-brand span { color: #2A9D8F; }
        h2 { margin-bottom: 8px; color: #202b35; }
        .subtitle { color: #667085; margin-bottom: 24px; }
        label { display: block; margin: 14px 0 6px; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d5dd;
            border-radius: 7px;
            font-size: 15px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #176b55;
            color: white;
            border: 0;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #115440; }
        .message { color: #b42318; font-size: 14px; }
        .footer { text-align: center; margin-top: 20px; font-size: 14px; }
        a { color: #176b55; }
    </style>
</head>
<body>
<div class="container">
    <a class="sf-brand" href="{% url 'home' %}">Spot<span>2Fix</span></a>
    <h2>Create your account</h2>
    <p class="subtitle">Join us in making your community better.</p>

    {% if messages %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="username">Username</label>
        <input id="username" type="text" name="username"
               autocomplete="username" required>

        <label for="email">Email address</label>
        <input id="email" type="email" name="email"
               autocomplete="email" required>

        <label for="password1">Password</label>
        <input id="password1" type="password" name="password1"
               autocomplete="new-password" required>

        <label for="password2">Confirm password</label>
        <input id="password2" type="password" name="password2"
               autocomplete="new-password" required>

        <button type="submit">Sign Up &amp; Send Email OTP</button>
    </form>

    <p class="footer">
        Already have an account?
        <a href="{% url 'loginuser' %}">Log in</a>
    </p>
</div>
</body>
</html>
